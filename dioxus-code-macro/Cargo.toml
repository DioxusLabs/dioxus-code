arborium-theme = "2.16.0"
betlang = { version = "0.1.1", optional = true }
macro-string = "0.1.4"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.103"
quote = "1.0.42"
syn = { version = "2.0.111", features = ["full"] }

[dev-dependencies]
dioxus-code = { workspace = true }
