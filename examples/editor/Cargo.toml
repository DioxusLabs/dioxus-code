[package]
name = "dioxus-code-editor-example"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Editor dioxus-code-editor example application."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
dioxus = { workspace = true, features = ["launch", "devtools", "logger"] }
dioxus-code = { workspace = true, features = ["runtime"] }
dioxus-code-editor = { workspace = true }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]
