[package]
name = "dioxus-code-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Syntax-highlighted code editor component for Dioxus."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
dioxus = { version = "0.7.0", default-features = false, features = ["lib"] }
dioxus-code = { workspace = true, features = ["runtime"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AbstractRange",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "InputEvent",
    "Location",
    "Node",
    "NodeList",
    "Range",
    "StaticRange",
    "Window",
] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dioxus/launch"]
web = ["dioxus/web", "dioxus/launch"]
