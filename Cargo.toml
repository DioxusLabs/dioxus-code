[workspace]
members = [
    ".",
    "code-editor",
    "dioxus-code-macro",
    "demo",
    "examples/basic",
    "examples/dioxus-hello",
    "examples/live-input",
    "examples/macro-only",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dioxus-code = { path = "." }
dioxus-code-editor = { path = "code-editor", default-features = false }

[package]
name = "dioxus-code"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["macro"]
macro = ["dep:dioxus-code-macro"]
runtime = ["arborium/lang-rust"]
lang-python = ["runtime", "arborium/lang-python"]
lang-toml = ["runtime", "arborium/lang-toml"]
all-languages = ["runtime", "arborium/all-languages"]

[dependencies]
arborium = { version = "2.16.0", default-features = false }
arborium-theme = "2.16.0"
dioxus = { version = "0.7.0", default-features = false, features = ["lib"] }
dioxus-code-macro = { path = "dioxus-code-macro", optional = true }

[build-dependencies]
arborium = { version = "2.16.0", default-features = false }

[dev-dependencies]
dioxus = { version = "0.7.0", features = ["ssr"] }
