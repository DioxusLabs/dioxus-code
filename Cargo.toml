[workspace]
members = [
    ".",
    "code-editor",
    "dioxus-code-macro",
    "docsite",
    "examples/basic",
    "examples/editor",
    "examples/live-input",
    "examples/macro-only",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/ealmloff/dioxus-code"
homepage = "https://dioxuslabs.github.io/dioxus-code/"
keywords = ["dioxus", "code", "highlighting", "editor"]
categories = ["gui", "web-programming"]

[workspace.dependencies]
dioxus-code = { version = "0.1.1", path = "." }
dioxus-code-editor = { version = "0.1.2", path = "code-editor", default-features = false }

[package]
name = "dioxus-code"
version = "0.1.3"
edition.workspace = true
license.workspace = true
description = "Syntax-highlighted code blocks for Dioxus."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["macro"]
macro = ["dep:dioxus-code-macro", "dioxus-code-macro/lang-rust"]
runtime = ["arborium/lang-rust", "dep:arborium-tree-sitter"]
detection = ["runtime", "dep:betlang", "dioxus-code-macro?/detection"]
detectable-languages = [
    "lang-asm",
    "lang-bash",
    "lang-batch",
    "lang-c",
    "lang-c-sharp",
    "lang-clojure",
    "lang-cmake",
